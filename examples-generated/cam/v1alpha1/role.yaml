apiVersion: cam.tencentcloud.crossplane.io/v1alpha1
kind: Role
metadata:
  annotations:
    meta.upbound.io/example-id: cam/v1alpha1/role
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    consoleLogin: true
    description: test
    document: |-
      ${jsonencode(
          {
            statement = [
              {
                action = "name/sts:AssumeRole"
                effect = "allow"
                principal = {
                  qcs = [
                    "qcs::cam::uin/${local.uin}:root",
                  ]
                }
              },
            ]
            version = "2.0"
          }
        )}
    name: tf-example
    sessionDuration: 7200
    tags:
      createBy: Terraform
