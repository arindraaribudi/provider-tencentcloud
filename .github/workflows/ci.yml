name: CI

on:
  push:
    branches:
      - main
      - release-*
    tags:
      - 'v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to use while publishing the package (e.g. v1.0.0-alpha.1)"
        default: ""
        required: false

env:
  GO_VERSION: "1.25.0"
  GOLANGCI_VERSION: "v2.12.2"
  DOCKER_BUILDX_VERSION: "v0.20.1"
  DOCKER_QEMU_ACTION: "docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3" # v3
  DOCKER_BUILDX_ACTION: "docker/setup-buildx-action@2b51285047da1547ffb1b2203d8be4c0af6b1f20" # v3
  DOCKER_LOGIN_ACTION: "docker/login-action@v3.3.0"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CR_PAT: ${{ secrets.CR_PAT }}
  UPBOUND_TOKEN: ${{ secrets.UPBOUND_TOKEN }}
  CROSSPLANE_REGORG: "ghcr.io/arindraaribudi"
  UPBOUND_REGORG: "xpkg.upbound.io/arindraaribudi"
  UPBOUND_REGORG_SLUG: "arindraaribudi"
  PROVIDER_REPO: provider-tencentcloud

jobs:
  detect-noop:
    runs-on: ubuntu-22.04
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@f75f66ce1886f00957d99748a42c724f4330bdcf # v5.3.1
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          paths_ignore: '["**.md", "**.png", "**.jpg"]'
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'

  lint:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Preflight
        uses: ./.github/actions/preflight
        with:
          cache_suffix: lint
          go_version: ${{ env.GO_VERSION }}
      # We could run 'make lint' but we prefer this action because it leaves
      # 'annotations' (i.e. it comments on PRs to point out linter violations).
      - name: Lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  check-diff:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Preflight
        uses: ./.github/actions/preflight
        with:
          cache_suffix: check-diff
          go_version: ${{ env.GO_VERSION }}
          install_goimports: "true"
      - name: Check Diff
        run: make check-diff

  unit-tests:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Preflight
        uses: ./.github/actions/preflight
        with:
          cache_suffix: unit-tests
          go_version: ${{ env.GO_VERSION }}
          fetch_history: "true"
      - name: Run Unit Tests
        run: make -j2 test
      - name: Publish Unit Test Coverage
        uses: codecov/codecov-action@v4
        with:
          flags: unittests
          file: _output/tests/linux_amd64/coverage.txt

  publish-artifacts:
    runs-on: ubuntu-22.04
    needs: detect-noop
    if: needs.detect-noop.outputs.noop != 'true'
    permissions:
      contents: read
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Login to GHCR using PAT
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ env.CR_PAT }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Preflight
        uses: ./.github/actions/preflight
        with:
          cache_suffix: publish-artifacts
          go_version: ${{ env.GO_VERSION }}
          fetch_history: "true"

      - name: Build Artifacts
        run: |-
          make -j XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.CROSSPLANE_REGORG }}" BRANCH_NAME="main" ${{ inputs.version != '' && format('VERSION={0}', inputs.version) || '' }} build.all
        env:
          # We're using docker buildx, which doesn't actually load the images it
          # builds by default. Specifying --load does so.
          BUILD_ARGS: "--load"

      - name: Publish Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: _output/**

      - name: Publish Artifacts
        run: |-
          make -j2 XPKG_REG_ORGS="${{ env.CROSSPLANE_REGORG }}" XPKG_REG_ORGS_NO_PROMOTE="${{ env.CROSSPLANE_REGORG }}" BRANCH_NAME="main" ${{ inputs.version != '' && format('VERSION={0}', inputs.version) || '' }} publish

  mirror-to-xpkg-upbound-io:
    needs: publish-artifacts
    if: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}
          install: true

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.4

      - name: Validate crane installation
        run: crane version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup up CLI
        uses: upbound/action-up@v1.2.0
        with:
          version: v0.49.1
          api-token: ${{ env.UPBOUND_TOKEN }}
          organization: ${{ env.UPBOUND_REGORG_SLUG }}

      - name: Pull xpkg artifact from GHCR
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          CROSSPLANE_REGORG: ${{ env.CROSSPLANE_REGORG }}
          PROVIDER_REPO: ${{ env.PROVIDER_REPO }}
        run: |
          set -euo pipefail
          crane pull "${CROSSPLANE_REGORG}/${PROVIDER_REPO}:${VERSION}" /tmp/mirror.xpkg
          ls -lh /tmp/mirror.xpkg

      - name: Resolve source digest
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          CROSSPLANE_REGORG: ${{ env.CROSSPLANE_REGORG }}
          PROVIDER_REPO: ${{ env.PROVIDER_REPO }}
        run: |
          set -euo pipefail
          DIGEST=$(crane digest "${CROSSPLANE_REGORG}/${PROVIDER_REPO}:${VERSION}")
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "Resolved digest: ${DIGEST}"

      - name: Append marketplace assets
        env:
          VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
          UPBOUND_REGORG: ${{ env.UPBOUND_REGORG }}
          CROSSPLANE_REGORG: ${{ env.CROSSPLANE_REGORG }}
          PROVIDER_REPO: ${{ env.PROVIDER_REPO }}
          DIGEST: ${{ env.DIGEST }}
        run: |
          set -euo pipefail
          up alpha xpkg append \
            --extensions-root=./extensions \
            --destination="${UPBOUND_REGORG}/${PROVIDER_REPO}:${VERSION}" \
            "${CROSSPLANE_REGORG}/${PROVIDER_REPO}@${DIGEST}"
