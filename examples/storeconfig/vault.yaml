apiVersion: secrets.crossplane.io/v1alpha1
kind: StoreConfig
metadata:
  name: vault
spec:
  # NOTE: type Vault is not yet supported by the StoreConfig v1alpha1 CRD
  # (only Kubernetes and Plugin config blocks exist). Using Kubernetes
  # as a placeholder so the manifest validates; switch back to Vault
  # once the CRD ships a `vault:` schema block.
  type: Kubernetes
  defaultScope: crossplane-system